  <style type="text/tailwindcss">
    @theme {
      --color-primary: #c96442;
      --color-primary-content: #ffffff;
      --color-secondary: #d97757;
      --color-secondary-content: #ffffff;
      --color-accent: #e8e6dc;
      --color-neutral: #141413;
      --color-base-100: #f5f4ed;
      --color-base-200: #faf9f5;
      --color-base-300: #e8e6dc;
      --color-base-content: #141413;
      --color-brand-muted: #5e5d59;
      --color-brand-border: #e8e6dc;
      --color-brand-cream: #fbf8ef;
      --color-brand-paper: #fffdf6;
      --color-brand-ink: #2d2a24;
      --color-brand-sage: #a3a585;
      --color-brand-clay: #b8654a;
      --color-brand-honey: #e7a55a;
      --color-brand-rose: #d98b7c;
      --shadow-brand: rgba(20,20,19,0.08) 0px 18px 40px -24px;
      --radius-box: 0.75rem;
      --radius-field: 0.5rem;
      --radius-selector: 0.5rem;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --font-hand: "Caveat", "Comic Sans MS", cursive;
    }
  </style>

  <style>
    html, body { min-height: 100%; }
    html { background: #fce4ce; }
    body {
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", "Helvetica Neue", "Noto Serif SC", Arial, sans-serif;
      color: #141413;
      background-color: #fce4ce;
      background-image:
        radial-gradient(circle at 6% 8%,  rgba(247,200,180,0.55), transparent 42%),
        radial-gradient(circle at 94% 4%, rgba(252,225,168,0.6), transparent 44%),
        radial-gradient(circle at 82% 92%, rgba(212,222,176,0.5), transparent 46%),
        radial-gradient(circle at 14% 86%, rgba(232,180,170,0.45), transparent 44%),
        radial-gradient(circle at 50% 50%, rgba(255,243,222,0.55), transparent 60%);
      background-attachment: fixed;
      background-size: cover;
    }
    #root { min-height: 100vh; background: transparent; }
    .font-display { font-family: "Fraunces", Georgia, serif; }
    .font-hand { font-family: "Caveat", "Comic Sans MS", cursive; }
    .font-mono-n { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
    .font-ming { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; font-weight: 600; }
    .font-ming-thin { font-family: "Noto Serif SC", "Songti SC", "STSong", serif; font-weight: 300; }
    .font-wenkai { font-family: "LXGW WenKai TC", "Noto Serif SC", "Songti SC", "STSong", serif; }
    .font-art  { font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Long Cang", "Noto Serif SC", serif; }
    .font-art-thin { font-family: "ZCOOL XiaoWei", "Noto Serif SC", "STSong", serif; }
    .vertical-rl  { writing-mode: vertical-rl; }

    .paper-card {
      background: linear-gradient(180deg, #fcf2d8 0%, #f5e6bd 100%);
      border: 1px solid #e6d3a0;
      border-radius: 18px;
      box-shadow:
        0 1px 0 rgba(255,250,232,0.85) inset,
        0 18px 40px -28px rgba(80,55,15,0.32),
        0 2px 4px -2px rgba(80,55,15,0.10);
      position: relative;
    }
    .paper-card-peach {
      background: linear-gradient(180deg, #fbdcc4 0%, #f3c1a0 100%);
      border-color: #e2a884;
    }
    .paper-card-sage {
      background: linear-gradient(180deg, #e8efcf 0%, #d2dca9 100%);
      border-color: #b8c389;
    }
    .paper-card-rose {
      background: linear-gradient(180deg, #f8dcd6 0%, #efbcb1 100%);
      border-color: #dfa599;
    }
    .paper-card-honey {
      background: linear-gradient(180deg, #fce7b3 0%, #f3cf86 100%);
      border-color: #e1b86c;
    }
    .paper-card-cocoa {
      background: linear-gradient(180deg, #efdfc0 0%, #e4cd9d 100%);
      border-color: #cdb076;
    }
    .paper-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 18px;
      background-image:
        radial-gradient(rgba(120,90,55,0.06) 1px, transparent 1px),
        radial-gradient(rgba(120,90,55,0.04) 1px, transparent 1px);
      background-size: 18px 18px, 36px 36px;
      background-position: 0 0, 9px 9px;
      mix-blend-mode: multiply;
      opacity: 0.5;
    }
    .paper-card > * { position: relative; z-index: 1; }

    .tape {
      position: absolute;
      width: 88px;
      height: 22px;
      background: linear-gradient(180deg, rgba(231,165,90,0.55), rgba(231,165,90,0.32));
      box-shadow: 0 2px 6px -2px rgba(120,80,40,0.3);
      transform: rotate(-4deg);
      top: -10px;
      left: 24px;
      border-radius: 2px;
    }
    .tape::before, .tape::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.5) 2px, transparent 2px, transparent 5px);
    }
    .tape::before { left: 0; }
    .tape::after { right: 0; }

    .pin-dot {
      width: 10px; height: 10px; border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #f3b079, #c96442 70%);
      box-shadow: 0 1px 2px rgba(0,0,0,0.25), inset 0 -1px 1px rgba(0,0,0,0.15);
    }

    .scroll-fade::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-fade::-webkit-scrollbar-thumb { background: #d4cdb6; border-radius: 8px; }
    .scroll-fade::-webkit-scrollbar-track { background: transparent; }

    .underline-wavy {
      text-decoration: underline wavy #d97757;
      text-underline-offset: 6px;
      text-decoration-thickness: 2px;
    }

    .doodle-grid {
      background-image:
        linear-gradient(rgba(40,28,12,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40,28,12,0.05) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    @keyframes wobble-in {
      0% { opacity: 0; transform: translateY(8px) rotate(-1deg); }
      100% { opacity: 1; transform: translateY(0) rotate(0); }
    }
    .wobble-in { animation: wobble-in .5s ease-out both; }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(0.6deg); }
    }
    .drift { animation: drift 6s ease-in-out infinite; }

    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    .sway { animation: sway 5s ease-in-out infinite; transform-origin: bottom center; }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-slow { animation: spin-slow 30s linear infinite; }

    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .float-y { animation: float-y 7s ease-in-out infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }

    .deco-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .deco-layer > * { position: absolute; }
    #root > * { position: relative; z-index: 1; }

    .kraft-cover {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      box-shadow:
        inset 0 0 0 1px rgba(80,55,15,0.25),
        inset 1px 1px 2px rgba(255,235,200,0.55),
        inset -1px -2px 3px rgba(60,35,8,0.45),
        0 2px 6px -1px rgba(60,35,8,0.4);
    }
    .kraft-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: #c89a6a;
      background-image:
        repeating-linear-gradient(
          92deg,
          rgba(255,239,210,0.18) 0 2px,
          transparent 2px 5px,
          rgba(80,45,15,0.10) 5px 7px,
          transparent 7px 11px
        ),
        repeating-linear-gradient(
          178deg,
          rgba(255,239,210,0.14) 0 3px,
          transparent 3px 8px,
          rgba(60,30,10,0.10) 8px 10px,
          transparent 10px 14px
        ),
        radial-gradient(circle at 28% 22%, rgba(255,238,200,0.45), transparent 38%),
        radial-gradient(circle at 78% 78%, rgba(60,30,10,0.30), transparent 42%),
        radial-gradient(circle at 65% 12%, rgba(80,40,10,0.18), transparent 35%);
      mix-blend-mode: normal;
      z-index: 0;
    }
    .kraft-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(60,30,10,0.18) 1px, transparent 1px),
        radial-gradient(rgba(255,235,200,0.18) 1px, transparent 1px);
      background-size: 6px 6px, 9px 9px;
      background-position: 0 0, 3px 4px;
      mix-blend-mode: overlay;
      opacity: 0.6;
      z-index: 1;
      pointer-events: none;
    }
    .kraft-cover > * { position: relative; z-index: 2; }
    .kraft-cover .kraft-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      mix-blend-mode: multiply;
      opacity: 0.55;
    }
    .kraft-cover .kraft-band {
      position: absolute;
      left: 0; right: 0; bottom: 14%;
      height: 18%;
      background: linear-gradient(180deg, rgba(40,22,8,0.65), rgba(40,22,8,0));
      z-index: 2;
    }

    .drag-ghost { opacity: 0.45; transform: rotate(-2deg) scale(0.96); }
    .drop-active {
      background-image: repeating-linear-gradient(45deg, rgba(201,100,66,0.08) 0 8px, transparent 8px 16px);
      border-color: #c96442 !important;
    }
  </style>
</head>
